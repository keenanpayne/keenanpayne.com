[build]
  command = "npm run build"
  publish = "build/client"

# Netlify serves the pre-rendered pages in `build/client` and sends every
# other request (404s, legacy redirects) to the React Router server function
# generated by `@netlify/vite-plugin-react-router`.
#
# Because that function answers every path, redirects live in the app
# (`app/routes/redirects.ts`) rather than here. Security headers are set in
# `app/lib/security-headers.ts`, which the build writes to `_headers`.
